# Keyless replay keeps the LSP composition intact and replaces only the model adapter.
- id: llm-local
  name: '@deepseek-ai/dsh-llm-local'
  disabled: true

- insert:
    - id: lsp
      name: '@deepseek-ai/dsh-lsp'
    - id: lsp-stdio
      name: '@deepseek-ai/dsh-lsp-stdio'
      config:
        servers:
          fixture:
            command: !!js process.execPath
            args: ['./lsp-server.mjs']
            extensionToLanguage:
              '.ts': typescript
    - id: tool-lsp
      name: '@deepseek-ai/dsh-tool-lsp'
      config:
        maxLocations: 1
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: local
            name: DeepSeek
            models:
              - id: local
              - id: local-pro

- id: timeout-policy
  name: '@deepseek-ai/dsh-tool-call-timeout-policy'
